name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge_check.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify the main commit came from a merged pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: merge_check
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha, per_page: 100
            });
            return pulls.some(pr => pr.base.ref === 'main' && pr.merged_at && pr.merge_commit_sha === context.sha);
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.merge_check.outputs.result == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.merged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
